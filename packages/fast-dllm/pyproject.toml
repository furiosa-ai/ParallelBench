[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-dllm"
version = "0.1.0"
description = "Fast Discrete Language Model inference"
requires-python = ">=3.12"
dependencies = [
    "transformers==4.52.4",
    "lm_eval==0.4.8",
    "accelerate==0.34.2",
    "antlr4-python3-runtime==4.11",
    "math_verify",
    "sympy",
    "hf_xet",
    "pydantic==2.10.6",
    "gradio",
]

[tool.setuptools.packages.find]
include = ["fast_dllm*"]
