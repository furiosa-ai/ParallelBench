global_config:
  num_samples: 100
  samples_per_length:
    default: 100
  icl_example_count: 1
tasks:
  latin_square_n4:
    type: latin_square
    metric: latin_square_score
    size: 4
    prompt: Generate a Latin square of size {size} with the symbols {symbols}. Only output the final result as CSV.
    icl_example:
      input:
        size: 4
        symbols: '[H, T, 6, P]'
      answer:
        symbols:
        - H
        - T
        - '6'
        - P
        example: '6,P,H,T

          P,H,T,6

          H,T,6,P

          T,6,P,H'
  latin_square_n4_concat:
    type: latin_square_concat
    metric: latin_square_concat_score
    size: 4
    prompt: Generate a Latin square of size {size} with the symbols {symbols}. Only output the final result. Write each row by concatenating the symbols without any separator.
    icl_example:
      input:
        size: 4
        symbols: '[H, T, 6, P]'
      answer:
        symbols:
        - H
        - T
        - '6'
        - P
        example: '6PHT

          PHT6

          HT6P

          T6PH'
  latin_square_n4_3shot_cyclic:
    type: latin_square
    metric: latin_square_score
    size: 4
    icl_example_count: 3
    prompt: Generate a Latin square of size {size} with the symbols {symbols}. Only output the final result as CSV.
    icl_examples:
      - input:
          size: 4
          symbols: '[H, T, 6, P]'
        answer:
          symbols: [H, T, '6', P]
          example: '6,P,H,T

            P,H,T,6

            H,T,6,P

            T,6,P,H'
      - input:
          size: 4
          symbols: '[W, 3, K, R]'
        answer:
          symbols: [W, '3', K, R]
          example: 'K,R,W,3

            R,W,3,K

            W,3,K,R

            3,K,R,W'
      - input:
          size: 4
          symbols: '[5, M, D, J]'
        answer:
          symbols: ['5', M, D, J]
          example: 'D,J,5,M

            J,5,M,D

            5,M,D,J

            M,D,J,5'
  latin_square_n4_3shot_diverse:
    type: latin_square
    metric: latin_square_score
    size: 4
    icl_example_count: 3
    prompt: Generate a Latin square of size {size} with the symbols {symbols}. Only output the final result as CSV.
    icl_examples:
      - input:
          size: 4
          symbols: '[H, T, 6, P]'
        answer:
          symbols: [H, T, '6', P]
          example: '6,P,H,T

            P,H,T,6

            H,T,6,P

            T,6,P,H'
      - input:
          size: 4
          symbols: '[W, 3, K, R]'
        answer:
          symbols: [W, '3', K, R]
          example: 'W,3,K,R

            3,W,R,K

            K,R,W,3

            R,K,3,W'
      - input:
          size: 4
          symbols: '[5, M, D, J]'
        answer:
          symbols: ['5', M, D, J]
          example: '5,M,D,J

            D,J,5,M

            J,5,M,D

            M,D,J,5'
  sudoku_n4:
    type: sudoku
    metric: sudoku_score
    size: 4
    num_holes: 4
    prompt: 'Fill the positions where the values are _ in a {size}x{size} grid with digits 1-{size} so that each column, each row, and each of the four 2x2 subgrids that compose the grid contains all of the digits from 1 to {size}.


      Input:

      {puzzle}

      Output:

      '
    icl_example:
      input:
        size: 4
        puzzle: '_143

          43_1

          1_34

          341_'
      answer: '2143

        4321

        1234

        3412'
