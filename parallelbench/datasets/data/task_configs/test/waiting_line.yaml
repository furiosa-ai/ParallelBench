global_config:
  words: first_last_names.yaml
  num_samples: 100
  samples_per_length:
    default: 25
  icl_example_count: 1
  min_length: 3
  max_length: 6
tasks:
  copy:
    type: copy
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      You need to record the following people in the order they arrived:


      {context}


      Please copy the list exactly and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
      answer: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
  insert_index:
    type: insert
    random_index: false
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      A new person "{word}" joins the line after the person at position {index}:


      {context}


      Please place the new person right after the specified person and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
        word: Virginia Hayes
        index: 1
      answer: '["Patrick Hicks", "Virginia Hayes", "Roy Ortiz", "Eric Reynolds"]'
  insert_random:
    type: insert
    random_index: true
    metric: list_random_insert_score
    prompt: 'You are managing a waiting line at a customer service desk.


      A new person "{word}" is inserted into the line at a random position:


      {context}


      Please put the new person in the random position and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
        word: Virginia Hayes
      answer:
        input:
        - Patrick Hicks
        - Roy Ortiz
        - Eric Reynolds
        word: Virginia Hayes
        example: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds", "Virginia Hayes"]'
  remove_index:
    type: remove
    random_index: false
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      The person at position {index} has left the waiting line:


      {context}


      Please remove the person at the specified position and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
        index: 2
      answer: '["Patrick Hicks", "Eric Reynolds"]'
  remove_random:
    type: remove
    random_index: true
    metric: list_random_remove_score
    prompt: 'You are managing a waiting line at a customer service desk.


      One person has left the waiting line:


      {context}


      Please remove a random person and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
      answer:
        input:
        - Patrick Hicks
        - Roy Ortiz
        - Eric Reynolds
        example: '["Patrick Hicks", "Eric Reynolds"]'
  replace_index:
    type: replace
    random_index: false
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      The person at position {index} must be replaced with "{word}":


      {context}


      Please replace the person at the specified position with "{word}" and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
        word: Virginia Hayes
        index: 2
      answer: '["Patrick Hicks", "Virginia Hayes", "Eric Reynolds"]'
  replace_random:
    type: replace
    random_index: true
    metric: list_random_replace_score
    prompt: 'You are managing a waiting line at a customer service desk.


      One person in the waiting line must be replaced with "{word}":


      {context}


      Please replace one random person with "{word}" and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
        word: Virginia Hayes
      answer:
        input:
        - Patrick Hicks
        - Roy Ortiz
        - Eric Reynolds
        word: Virginia Hayes
        example: '["Patrick Hicks", "Virginia Hayes", "Eric Reynolds"]'
  reverse:
    type: reverse
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      The previous staff member put the waiting line in the wrong order.


      Please reverse the order of the following people in the waiting line to correct it:


      {context}


      Please reverse the order of the list and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
      answer: '["Eric Reynolds", "Roy Ortiz", "Patrick Hicks"]'
  shuffle:
    type: shuffle
    metric: list_shuffle_score
    prompt: 'You are managing a waiting line at a customer service desk.


      The waiting line should be randomly shuffled to ensure fair service distribution:


      {context}


      Please randomly shuffle the list and provide only the final list.


      Ensure the sequence is different from the original.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
      answer:
        input:
        - Patrick Hicks
        - Roy Ortiz
        - Eric Reynolds
        example: '["Patrick Hicks", "Eric Reynolds", "Roy Ortiz"]'
  sort:
    type: sort
    metric: list_match_score
    prompt: 'You are managing a waiting line at a customer service desk.


      The following people should be organized alphabetically by last name for efficient processing:


      {context}


      Please sort the list in alphabetical order and provide only the final list.'
    icl_example:
      input:
        context: '["Patrick Hicks", "Roy Ortiz", "Eric Reynolds"]'
      answer: '["Eric Reynolds", "Patrick Hicks", "Roy Ortiz"]'
